<div class="container mt-4">

    <div class="card shadow-sm border-0 rounded-4 p-4">

    <h4 class="mb-4 fw-bold text-dark">Book List</h4>
    
    <a routerLink="/books/new" class="btn btn-dark mb-4 px-4 py-2 rounded-pill shadow-sm">
        <i class="fa-solid fa-plus me-2"></i>Add new book
    </a>

    <div class="list-group">
        @for (book of books; track book.id){
            <div class="list-group-item d-flex flex-column flex-md-row justify-content-between 
            align-items-start align-items-md-center gap-2">
                <div>
                    <strong>{{book.title}}</strong>
                    <span class="text-muted"> by {{ book.author }} ({{ book.publishedDate }})</span>
                    @if (book.description){
                        <div class="text-muted small">{{ book.description }}</div>
                    }
                </div>
                @if (isOwner(book.ownerUsername)) {
                <div>
                    <a [routerLink]="['/books', book.id, 'edit']" class="btn btn-sm btn-dark me-2">
                        <i class="fa-solid fa-pen"></i> Edit
                    </a>
                    <button (click)="deleteBook(book.id)" class="btn btn-sm btn-danger">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                </div>
                }
            </div>
        }
    </div>


    </div>
</div>

<div class="container mt-4">
    <div class="card shadow-sm border-0 rounded-4 p-4">

    <h4 class="mb-4 fw-bold text-dark">My Quotes</h4>

    <a routerLink="/quotes/new" class="btn btn-dark mb-4 px-4 py-2 rounded-pill shadow-sm">
        <i class="fa-solid fa-plus me-2"></i> Add new quote
    </a>

    <div class="list-group">
        @for(quote of quotes; track quote.id){
        <div class="list-group-item d-flex flex-column flex-md-row justify-content-between 
            align-items-start align-items-md-center gap-2">
            <div>
                <p class="mb-1 fst-italic">{{ quote.text }}</p>
                <span class="text-muted">
                        @if(quote.author) { - {{ quote.author }}}
                        @if(quote.bookTitle) { (from {{ quote.bookTitle }}) }
                </span>
            </div>

        <div>
            <a [routerLink]="['/quotes', quote.id, 'edit']" class="btn btn-sm btn-dark me-2">
                <i class="fa-solid fa-pen"></i> Edit
            </a>
            <button (click)="deleteQuote(quote.id)" class="btn btn-sm btn-danger">
                <i class="fa-solid fa-trash"></i> Delete
            </button>
        </div>
        
        </div>
        }
        </div>
    </div>
</div>
